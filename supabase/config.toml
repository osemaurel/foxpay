project_id = "foxpay"

# Ces fonctions sont appelées par des visiteurs non authentifiés
# (acheteur ou serveurs pawaPay et SebPay) : pas de JWT à vérifier. Leur
# sécurité tient à ce qu'elles vérifient elles-mêmes — voir les commentaires de
# chaque fonction.
#
# payment-methods et resend-delivery ne sont pas dans cette liste : elles
# servent l'administration, et vérifient en plus le jeton elles-mêmes pour
# retrouver la boutique.

[functions.create-payment]
verify_jwt = false

[functions.pawapay-callback]
verify_jwt = false

[functions.order-status]
verify_jwt = false

[functions.download]
verify_jwt = false

[functions.payment-options]
verify_jwt = false

[functions.predict-phone]
verify_jwt = false

[functions.sebpay-callback]
verify_jwt = false

[functions.pawapay-payout-callback]
verify_jwt = false

[functions.rappels]
verify_jwt = false
