<!doctype html>
<html lang="fr">
  <head>
    <script>
      // Appliqué avant le rendu : sinon la page clignote en sombre au chargement
      // pour quelqu'un qui a choisi le clair.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('foxpay-theme') === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <style>
      html { background: #000 }
      html[data-theme="light"] { background: #f6f6f7 }
      body { margin: 0 }
    </style>

        <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boutique</title>
    <style>
      #boot {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        max-width: 40rem;
        margin: 15vh auto;
        padding: 0 1.5rem;
        color: light-dark(#09090b, #ffffff);
        line-height: 1.6;
      }
      #boot h1 { font-size: 1.125rem; margin: 0 0 0.75rem; }
      #boot pre {
        background: light-dark(rgba(9,9,11,0.05), #0a0a0a);
        border: 1px solid light-dark(rgba(9,9,11,0.12), rgba(255,255,255,0.08));
        border-radius: 0.5rem;
        padding: 0.75rem;
        overflow-x: auto;
        font-size: 0.8125rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #boot .muted { color: light-dark(rgba(9,9,11,0.5), rgba(255,255,255,0.4)); font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <!--
      Ce bloc est remplacé par React dès qu'il monte. S'il reste visible, c'est
      que le JavaScript n'a pas démarré — et on préfère le dire plutôt que de
      servir une page blanche dont la seule explication est dans la console.
    -->
    <div id="root">
      <div id="boot"><p class="muted">Chargement…</p></div>
    </div>

    <script>
      (function () {
        function report(title, detail) {
          var boot = document.getElementById('boot')
          if (!boot) return
          boot.innerHTML =
            '<h1></h1><pre></pre><p class="muted">Cette page est servie correctement : ' +
            "l'erreur vient du script de l'application.</p>"
          boot.querySelector('h1').textContent = title
          boot.querySelector('pre').textContent = detail
        }

        window.addEventListener('error', function (event) {
          report(
            'Le script a échoué au démarrage',
            (event.message || 'Erreur inconnue') +
              (event.filename ? '\n\n' + event.filename + ':' + event.lineno : ''),
          )
        })

        window.addEventListener('unhandledrejection', function (event) {
          report('Erreur non interceptée', String(event.reason))
        })

        // Si React n'a pas remplacé le bloc au bout de 8 s, le bundle n'a pas
        // été chargé du tout : mauvais chemin d'asset, 404, ou blocage réseau.
        setTimeout(function () {
          if (document.getElementById('boot')) {
            report(
              "L'application ne s'est pas lancée",
              "Le fichier JavaScript n'a pas été exécuté. Vérifie dans l'onglet " +
                'Réseau que /assets/index-*.js répond bien en 200 et non en 404.',
            )
          }
        }, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
